# 在云端 macOS 上生成「未签名 iOS 包」，供你用自签软件（AltStore / Sideloadly / TrollStore 等）签名安装
#
# 为什么需要这个工作流：
#   编译 iOS 二进制必须用 macOS 上的 Xcode，Windows 做不到。
#   这里借用 GitHub 提供的免费 macOS runner 完成「编译」，
#   你自己完成「签名」——所以不需要 Apple 开发者账号，也不用交出证书。
#
# 用法：
#   1. 把项目推到 GitHub 仓库
#   2. 仓库页面 → Actions → 左侧选 "Build unsigned iOS app" → 右侧 Run workflow
#   3. 等约 10~20 分钟
#   4. 在跑完的那次运行页面底部 Artifacts 里下载 volunteer-watch-unsigned-ipa

name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑核心逻辑单元测试（离线部分）
        run: npm run test:offline

      - name: 生成原生 iOS 工程
        run: npx expo prebuild --platform ios --clean

      - name: 安装 CocoaPods 依赖
        working-directory: ios
        run: pod install

      - name: 列出可用的 workspace / scheme（便于排查）
        working-directory: ios
        run: |
          echo "=== 目录内容 ==="
          ls -la
          echo "=== 可用 scheme ==="
          xcodebuild -list -workspace *.xcworkspace || true

      - name: 编译 Release（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])" 2>/dev/null \
            || xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{getline; gsub(/^[ \t]+/,""); print; exit}')
          echo "WORKSPACE=$WORKSPACE"
          echo "SCHEME=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -60

      - name: 打包成未签名 ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到编译产物 .app，请查看上面 xcodebuild 的日志"
            find build/Build/Products -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "找到 app: $APP_PATH"
          mkdir -p ../unsigned/Payload
          cp -R "$APP_PATH" ../unsigned/Payload/
          cd ../unsigned
          zip -qry ../volunteer-watch-unsigned.ipa Payload
          echo "=== 产物信息 ==="
          ls -lh ../volunteer-watch-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: volunteer-watch-unsigned-ipa
          path: volunteer-watch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
