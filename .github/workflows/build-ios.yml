name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # 需要最新的 26.x（Swift 6.2.4），因为它只剩一个可修补的错误
      - name: Select newest Xcode 26.x (needs Swift 6.2)
        run: |
          echo "===== available Xcodes ====="
          ls -d /Applications/Xcode*.app || true
          CHOSEN=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CHOSEN" ]; then
            CHOSEN=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting: $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          echo "===== active toolchain ====="
          xcode-select -p
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain versions
        run: |
          echo "===== sw_vers ====="
          sw_vers
          echo "===== xcodebuild -version ====="
          xcodebuild -version
          echo "===== node / npm ====="
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (offline)
        run: npm run test:offline

      # 修补 Expo 上游 bug：expo-modules-jsi 把 SWIFT_RETURNS_RETAINED
      # 误加在【构造函数】上。构造函数没有「返回值」这个概念，该标注只对
      # 工厂函数有意义；类级别已经有正确的 SWIFT_SHARED_REFERENCE，
      # 所以删掉这两个标注是语义等价的。
      # Xcode 26.2+ 的 Clang 会把它报成错误：
      #   'RuntimeScheduler' cannot be annotated with either
      #   SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_NOT_RETAINED
      # 已确认上游 58.0.7 仍未修复，故在 CI 内打补丁。
      - name: Patch expo-modules-jsi for Xcode 26.x
        run: |
          HDR=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          PKG=node_modules/expo-modules-jsi/apple/Package.swift
          for f in "$HDR" "$PKG"; do
            if [ ! -f "$f" ]; then echo "::error::file not found: $f"; exit 1; fi
          done

          echo "########## 补丁 1：构造函数上的 SWIFT_RETURNS_RETAINED ##########"
          echo "---- before ----"
          grep -n "SWIFT_RETURNS_RETAINED" "$HDR" || echo "(none)"
          # 用 perl 而不是 sed -i：macOS 的 BSD sed 要求 `-i ''`，
          # 直接 `sed -i` 会把替换脚本当成备份后缀而报错。
          perl -pi -e 's/SWIFT_RETURNS_RETAINED RuntimeScheduler\(/RuntimeScheduler(/g' "$HDR"
          echo "---- after ----"
          grep -n "SWIFT_RETURNS_RETAINED" "$HDR" || echo "(removed from constructors)"

          echo "########## 补丁 2：Swift 6 -> 5 语言模式 ##########"
          echo "---- before ----"
          grep -n "swiftLanguageModes" "$PKG"
          # 该包在 Swift 6 严格并发下有一批 "sending ... risks causing data races"
          # 错误（expo-modules-jsi 57.1.1 与 58.0.7 都一样，属上游未修复）。
          # 降到 Swift 5 语言模式只会把这些诊断变成警告，不改变代码生成与运行时行为。
          perl -pi -e 's/swiftLanguageModes:\s*\[\.v6\]/swiftLanguageModes: [.v5]/' "$PKG"
          echo "---- after ----"
          grep -n "swiftLanguageModes" "$PKG"

          echo "########## 一致性校验 ##########"
          if ! grep -q "SWIFT_SHARED_REFERENCE" "$HDR"; then
            echo "::error::class-level SWIFT_SHARED_REFERENCE was lost"; exit 1
          fi
          if ! grep -q "RuntimeScheduler(void \*scheduler, ScheduleFn fn)" "$HDR"; then
            echo "::error::scheduler constructor signature changed unexpectedly"; exit 1
          fi
          if ! grep -q "swiftLanguageModes: \[\.v5\]" "$PKG"; then
            echo "::error::swiftLanguageModes patch did not apply"; exit 1
          fi
          echo "both patches OK"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: pod install
        working-directory: ios
        run: pod install

      - name: List workspace and schemes
        working-directory: ios
        run: |
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build Release (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "WORKSPACE=$WORKSPACE"
          echo "SCHEME=$SCHEME"

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > /tmp/xcodebuild.log 2>&1
          STATUS=$?
          set -e

          echo "===== xcodebuild exit code: $STATUS ====="
          echo "===== total log lines: $(wc -l < /tmp/xcodebuild.log) ====="
          echo "===== ALL error: lines ====="
          grep -n "error:" /tmp/xcodebuild.log | head -60 || echo "(no 'error:' lines)"
          echo "===== SPM resolution error context (40 lines after) ====="
          grep -n -A 40 "Could not resolve package dependencies" /tmp/xcodebuild.log | head -80 || true
          echo "===== any xcodebuild error blocks ====="
          grep -n -B 3 -A 30 "xcodebuild: error" /tmp/xcodebuild.log | head -100 || true
          echo "===== last 60 lines ====="
          tail -60 /tmp/xcodebuild.log

          if [ $STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Package unsigned ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app produced"
            find build/Build/Products -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "found app: $APP"
          mkdir -p ../unsigned/Payload
          cp -R "$APP" ../unsigned/Payload/
          cd ../unsigned
          zip -qry ../volunteer-watch-unsigned.ipa Payload
          ls -lh ../volunteer-watch-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: volunteer-watch-unsigned-ipa
          path: volunteer-watch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
