name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # 关键：Xcode 版本的窗口很窄，两个条件必须同时满足：
      #   1) Swift tools >= 6.2 —— 否则 ExpoModulesJSI 的 SPM 包报
      #      "package 'apple' is using Swift tools version 6.2.0 but the installed version is 6.1.0"
      #      （macos-15 默认的 Xcode 16.4 就是 6.1，不行）
      #   2) Xcode < 26.2 —— 因为 expo-modules-jsi 把 SWIFT_RETURNS_RETAINED
      #      误加在构造函数上，Xcode 26.2+ 的 Clang 会直接报错
      #      （已确认上游 58.0.7 仍未修复，属 Expo 已知问题）
      # 所以选 26.0/26.1 系列：Swift 6.2 有了，又还没开始报这个错。
      - name: Select Xcode (Swift 6.2 but < 26.2)
        run: |
          echo "===== available Xcodes ====="
          ls -d /Applications/Xcode*.app || true

          CANDIDATES="/Applications/Xcode_26.1.1.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app"
          CHOSEN=""
          for c in $CANDIDATES; do
            if [ -d "$c" ]; then CHOSEN="$c"; break; fi
          done

          # 兜底：挑一个 26.x 里最小的（而不是最大的），避免落到 26.2+
          if [ -z "$CHOSEN" ]; then
            CHOSEN=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          fi
          if [ -z "$CHOSEN" ]; then
            CHOSEN=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi

          echo "Selecting: $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          echo "===== active toolchain ====="
          xcode-select -p
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain versions
        run: |
          echo "===== sw_vers ====="
          sw_vers
          echo "===== xcodebuild -version ====="
          xcodebuild -version
          echo "===== node / npm ====="
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (offline)
        run: npm run test:offline

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: pod install
        working-directory: ios
        run: pod install

      - name: List workspace and schemes
        working-directory: ios
        run: |
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build Release (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "WORKSPACE=$WORKSPACE"
          echo "SCHEME=$SCHEME"

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > /tmp/xcodebuild.log 2>&1
          STATUS=$?
          set -e

          echo "===== xcodebuild exit code: $STATUS ====="
          echo "===== total log lines: $(wc -l < /tmp/xcodebuild.log) ====="
          echo "===== ALL error: lines ====="
          grep -n "error:" /tmp/xcodebuild.log | head -60 || echo "(no 'error:' lines)"
          echo "===== SPM resolution error context (40 lines after) ====="
          grep -n -A 40 "Could not resolve package dependencies" /tmp/xcodebuild.log | head -80 || true
          echo "===== any xcodebuild error blocks ====="
          grep -n -B 3 -A 30 "xcodebuild: error" /tmp/xcodebuild.log | head -100 || true
          echo "===== last 60 lines ====="
          tail -60 /tmp/xcodebuild.log

          if [ $STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Package unsigned ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app produced"
            find build/Build/Products -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "found app: $APP"
          mkdir -p ../unsigned/Payload
          cp -R "$APP" ../unsigned/Payload/
          cd ../unsigned
          zip -qry ../volunteer-watch-unsigned.ipa Payload
          ls -lh ../volunteer-watch-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: volunteer-watch-unsigned-ipa
          path: volunteer-watch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
