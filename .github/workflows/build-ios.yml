name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-unsigned:
    # ⚠️ 必须用 macos-26。
    #
    # 2026-10-03 的排查经过：
    #   #42~#46 全部秒失败（runner 为空、steps=0）—— 当时误判为 runner 标签问题，
    #   改成 macos-15 后能跑起来，但 xcodebuild 报错（见下），
    #   再用 ubuntu 探测才发现【ubuntu 也拿不到机器】→ 真正原因是
    #   GitHub Actions 额度用完（私有库 2000 分钟/月，macOS 按 10 倍算）。
    #   仓库改为公开后额度不再受限，于是可以回到原本正确的标签。
    #
    # 为什么不能用 macos-15：它自带 Xcode 26.3，其 Swift 6 严格并发检查会把
    # expo-modules-jsi 编译失败（上游未修）：
    #   JavaScriptRuntime.swift:193:43: error: sending 'resultPtr' risks causing data races
    #   JavaScriptRuntime.swift:786/787/789/829/830/831: 同样的错误，共 7 处
    #   → ** BUILD FAILED ** PhaseScriptExecution Build ExpoModulesJSI xcframework
    # macos-26 自带 Xcode 26.6，不存在这个诊断。
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "===== available Xcodes ====="
          ls -d /Applications/Xcode*.app || true
          CHOSEN=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CHOSEN" ]; then
            CHOSEN=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting: $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          echo "===== active toolchain ====="
          xcode-select -p
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show versions
        run: |
          sw_vers
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (offline)
        run: npm run test:offline

      # 修补 Expo 上游 bug：expo-modules-jsi 把 SWIFT_RETURNS_RETAINED
      # 误加在【构造函数】上。构造函数没有「返回值」概念，该标注只对工厂
      # 函数有意义；类级别已有正确的 SWIFT_SHARED_REFERENCE（下面的校验会
      # 确认它没被破坏），所以删掉这两个标注是语义等价的。
      #
      # Xcode 26.2+ 的 Clang 会把它报成错误：
      #   'RuntimeScheduler' cannot be annotated with either
      #   SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_NOT_RETAINED
      # 已确认上游 58.0.7 仍未修复，故在 CI 内打补丁。
      - name: Patch expo-modules-jsi for Xcode 26.2+
        run: |
          HDR=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          if [ ! -f "$HDR" ]; then
            echo "::error::header not found: $HDR"
            exit 1
          fi

          echo "---- before ----"
          grep -n "SWIFT_RETURNS_RETAINED" "$HDR" || echo "(none)"

          # 用 perl 而不是 sed -i：macOS 的 BSD sed 要求 `-i ''`，
          # 直接 `sed -i` 会把替换脚本当成备份后缀而报错。
          perl -pi -e 's/SWIFT_RETURNS_RETAINED RuntimeScheduler\(/RuntimeScheduler(/g' "$HDR"

          echo "---- after ----"
          grep -n "SWIFT_RETURNS_RETAINED" "$HDR" || echo "(removed from constructors)"

          # 一致性校验：别把类级标注或构造函数签名改坏
          if ! grep -q "SWIFT_SHARED_REFERENCE" "$HDR"; then
            echo "::error::class-level SWIFT_SHARED_REFERENCE was lost"; exit 1
          fi
          if ! grep -q "RuntimeScheduler(void \*scheduler, ScheduleFn fn)" "$HDR"; then
            echo "::error::scheduler constructor signature changed unexpectedly"; exit 1
          fi
          echo "patch OK"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: pod install
        working-directory: ios
        run: pod install

      - name: List workspace and schemes
        working-directory: ios
        run: |
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build Release (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "WORKSPACE=$WORKSPACE"
          echo "SCHEME=$SCHEME"

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > /tmp/xcodebuild.log 2>&1
          STATUS=$?
          set -e

          echo "===== xcodebuild exit code: $STATUS ====="
          echo "===== total log lines: $(wc -l < /tmp/xcodebuild.log) ====="
          echo "===== ALL error: lines ====="
          grep -n "error:" /tmp/xcodebuild.log | head -60 || echo "(no 'error:' lines)"
          echo "===== last 80 lines ====="
          tail -80 /tmp/xcodebuild.log

          if [ $STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Package unsigned ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app produced"
            find build/Build/Products -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "found app: $APP"
          mkdir -p ../unsigned/Payload
          cp -R "$APP" ../unsigned/Payload/
          cd ../unsigned
          zip -qry ../volunteer-watch-unsigned.ipa Payload
          ls -lh ../volunteer-watch-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: volunteer-watch-unsigned-ipa
          path: volunteer-watch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
