name: runner-check

# 只用来判断「GitHub Actions 到底能不能给这个仓库分配机器」：
# ubuntu 能跑、macOS 跑不了 → macOS 额度/计费问题；
# 两个都跑不了 → 账号级的 Actions 问题。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ubuntu-probe:
    runs-on: ubuntu-latest
    steps:
      - name: 能拿到 ubuntu 机器吗
        run: |
          echo "ubuntu runner OK"
          uname -a

  macos-probe:
    runs-on: macos-15
    steps:
      - name: 能拿到 macOS 机器吗
        run: |
          echo "macos runner OK"
          sw_vers
